version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Dockerfile pins node:22-bookworm-slim by digest so the deploy
  # target only re-pulls the base layers when this PR is merged, not
  # every time Docker Hub refreshes the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Node majors (e.g. 22 -> 25, an odd non-LTS line) are a deliberate
    # upgrade: CI's NODE_VERSION has to move with them. Digest and
    # patch bumps of the pinned tag still come through.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
