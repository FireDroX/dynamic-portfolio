version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The Dockerfile pins node:22-bookworm-slim by digest so the deploy
  # target only re-pulls the base layers when this PR is merged, not
  # every time Docker Hub refreshes the tag.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
