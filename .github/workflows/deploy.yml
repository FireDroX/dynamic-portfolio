name: Deploy

# Runs only after the CI workflow completes successfully on main — never
# on a PR, and never if lint/tests/build failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions: {}
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over the Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF

      # build.sh (repo root) pulls ghcr.io/firedrox/portfolio-image:latest
      # and recreates the `portfolio` container with it — see that file
      # for the exact docker run flags (network, volume, port, env-file).
      # `git pull` first so the server always runs the build.sh version
      # committed on main; `chmod +x` in case the exec bit was lost (git
      # only preserves the mode it tracked at checkout/clone time).
      # DEPLOY_PATH is intentionally unquoted below so a leading `~` in
      # it still expands remotely (quoted, bash treats `~` as a literal
      # char).
      #
      # build.sh runs detached (setsid + nohup) instead of inside the SSH
      # session: pulling/unpacking the image can saturate the deploy
      # target's CPU long enough for the Cloudflare Tunnel to drop the
      # connection, and a dropped session used to SIGHUP build.sh midway.
      # Its output goes to deploy.log and its exit code to .deploy-exit,
      # which the next step polls for.
      - name: git pull && start ./build.sh
        run: |
          ssh deploy-target bash -s <<'EOF'
          set -euo pipefail
          cd ${{ secrets.DEPLOY_PATH }}
          git pull
          chmod +x build.sh
          rm -f .deploy-exit
          nohup setsid bash -c './build.sh > deploy.log 2>&1; echo $? > .deploy-exit' < /dev/null > /dev/null 2>&1 &
          EOF

      # Reconnects on every attempt, so a connection lost while the
      # target is busy unpacking just means "try again in 10s".
      - name: Wait for build.sh
        run: |
          for attempt in $(seq 1 60); do
            sleep 10
            if ! code=$(ssh deploy-target "cat ${{ secrets.DEPLOY_PATH }}/.deploy-exit 2>/dev/null || true"); then
              echo "Deploy target unreachable (attempt ${attempt}/60), retrying..."
              continue
            fi
            if [ -n "${code}" ]; then
              ssh deploy-target "cat ${{ secrets.DEPLOY_PATH }}/deploy.log"
              exit "${code}"
            fi
          done
          echo "build.sh still running after 10 minutes." >&2
          exit 1
