name: Deploy

# Runs only after the CI workflow completes successfully on main — never
# on a PR, and never if lint/tests/build failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      packages: read
    steps:
      - name: Compute image reference
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/portfolio-image:latest" >> "$GITHUB_OUTPUT"

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over the Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      # GITHUB_TOKEN is masked in the log automatically. This login is
      # scoped to the deploy target's docker daemon and only needs to
      # survive long enough for the `pull` step right after — the
      # token itself expires with this job run.
      - name: Log in to the Container registry on the deploy target
        run: |
          ssh deploy-target "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      # Mirrors build.sh (the author's own manual deploy script): same
      # container name, network, published port and named volume, but
      # pulling the image CI already built and pushed instead of
      # building it on the server. DEPLOY_PATH points at the directory
      # on the server that holds the .env file build.sh also reads —
      # it's intentionally unquoted below so a leading `~` still
      # expands remotely (quoted, bash treats `~` as a literal char).
      - name: docker pull && recreate the portfolio container
        run: |
          ssh deploy-target "docker pull ${{ steps.image.outputs.name }} && \
            docker rm -f portfolio 2>/dev/null; \
            docker run -d \
              --init \
              --env-file ${{ secrets.DEPLOY_PATH }}/.env \
              -p 127.0.0.1:3333:3000 \
              --network mariadb-network \
              --name portfolio \
              --restart unless-stopped \
              -v portfolio_projects:/app/projects \
              ${{ steps.image.outputs.name }}"
