name: Deploy

# Runs only after the CI workflow completes successfully on main — never
# on a PR, and never if lint/tests/build failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      packages: read
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over the Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.DEPLOY_SSH_HOSTNAME }}
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      # GITHUB_TOKEN is masked in the log automatically. This login is
      # scoped to the deploy target's docker daemon and only needs to
      # survive long enough for the `pull` step right after — the
      # token itself expires with this job run.
      - name: Log in to the Container registry on the deploy target
        run: |
          ssh deploy-target "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      # build.sh (repo root) pulls ghcr.io/firedrox/portfolio-image:latest
      # and recreates the `portfolio` container with it — see that file
      # for the exact docker run flags (network, volume, port, env-file).
      # `git pull` first so the server always runs the build.sh version
      # committed on main; `chmod +x` in case the exec bit was lost (git
      # only preserves the mode it tracked at checkout/clone time).
      # DEPLOY_PATH is intentionally unquoted below so a leading `~` in
      # it still expands remotely (quoted, bash treats `~` as a literal
      # char).
      - name: git pull && ./build.sh
        run: |
          ssh deploy-target "cd ${{ secrets.DEPLOY_PATH }} && git pull && chmod +x build.sh && ./build.sh"
